<div class="proof-item" data-areas="{{ include.item.area }}"{% unless include.item.top %} data-hide-in-all{% endunless %}>
  <div class="proof-top">
    <span class="ico tone-{{ include.item.tone }}" aria-hidden="true">
      {% include icon.html name=include.item.icon %}
    </span>
    <div class="proof-value">{{ include.item.value }}</div>
    {% if include.item.tone == "up" %}<span class="dir dir-up" title="Increased">&#9650;</span>{% elsif include.item.tone == "down" %}<span class="dir dir-down" title="Reduced">&#9660;</span>{% elsif include.item.tone == "save" %}<span class="dir dir-save" title="Saved">&#10003;</span>{% endif %}
  </div>
  <div class="proof-label">{{ include.item.label }}</div>
</div>
