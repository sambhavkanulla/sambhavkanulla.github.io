<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
      <nav class="nav">
        <a href="{{ '/case-studies/' | relative_url }}">Case studies</a>
        <a href="{{ '/experience/' | relative_url }}">Experience</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a class="nav-cta" href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>&copy; {{ site.time | date: "%Y" }} {{ site.data.profile.name }}</span>
      <span>Last updated {{ site.time | date: "%d %B %Y" }}</span>
      <span>
        <a href="{{ site.data.profile.linkedin }}">LinkedIn</a> ·
        <a href="mailto:{{ site.data.profile.email }}">Email</a>
      </span>
    </div>
  </footer>
</body>
</html>
