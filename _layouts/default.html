<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
      <nav class="nav">
        <a href="{{ '/case-studies/' | relative_url }}"{% if page.url contains '/case-studies/' %} class="active" aria-current="page"{% endif %}>Case studies</a>
        <a href="{{ '/experience/' | relative_url }}"{% if page.url contains '/experience/' %} class="active" aria-current="page"{% endif %}>Experience</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>&copy; {{ site.time | date: "%Y" }} {{ site.data.profile.name }}</span>
      <span>Last updated {{ site.time | date: "%d %B %Y" }}</span>
      <span>
        <a href="{{ site.data.profile.linkedin }}">LinkedIn</a> ·
        <a href="mailto:{{ site.data.profile.email }}">Email</a>
      </span>
    </div>
  </footer>
  <script src="{{ '/assets/js/areas.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
