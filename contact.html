---
layout: page
title: "Contact"
intro: "The best way to reach me is email or LinkedIn."
permalink: /contact/
---
{% assign p = site.data.profile %}
<div class="prose">
  <p>{{ p.open_to }}</p>
  <p class="cta-row">
    <a class="btn" href="mailto:{{ p.email }}">{{ p.email }}</a>
    <a class="btn btn-ghost" href="{{ p.linkedin }}">LinkedIn</a>
    {% if p.resume_file != "" %}<a class="btn btn-ghost" href="{{ p.resume_file | relative_url }}">Resume (PDF)</a>{% endif %}
  </p>
</div>
