# ------------------------------------------------------------
# SITE SETTINGS  (you rarely need to touch this file)
# ------------------------------------------------------------
title: "Sambhav Kanulla"
description: "Product leader for commerce, delivery and supply chain."
url: "https://sambhavkanulla.github.io"
baseurl: ""
lang: en

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  case_studies:
    output: true
    permalink: /case-studies/:name/

defaults:
  - scope:
      path: ""
      type: case_studies
    values:
      layout: case_study
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - README.md
  - EDIT-GUIDE.md
